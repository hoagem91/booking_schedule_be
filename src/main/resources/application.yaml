server:
  port: ${PORT:8080}
  servlet:
    context-path: /booking-schedule
spring:
  profiles:
    default: local
  application:
    name: examine
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
jwt:
  valid-duration: 3600
  refreshable-duration: 36000
