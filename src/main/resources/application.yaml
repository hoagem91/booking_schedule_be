server:
  port: 8080
  servlet:
    context-path: /booking-schedule
spring:
  application:
    name: examine
  datasource:
    url: jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQL_DATABASE:booking_schedule}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driverClassName: "com.mysql.cj.jdbc.Driver"
    username: ${MYSQLUSER:root}
    password: ${MYSQL_ROOT_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
jwt:
  signerKey: "j38OL4j9L2ccemjFShXzDRwAjPzMNnYRhvyBBfF45nFU8xNB4xfIf3yYBNhywlaWDfcfQcNRrCjDcLKUdj9SwT"
  valid-duration: 3600
  refreshable-duration: 36000